name: Update News Feed

on:
  schedule:
    - cron: "0 * * * *"   # roda a cada hora
  workflow_dispatch:       # permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # dá permissão para o workflow fazer push
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # versão atualizada

      - name: Set up Python
        uses: actions/setup-python@v5   # versão atualizada
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/news.json
          git commit -m "Update news feed" || echo "No changes to commit"
          git push
